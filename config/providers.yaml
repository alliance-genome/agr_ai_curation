# =============================================================================
# LLM PROVIDER CONFIGURATION
# =============================================================================
# Defines runtime LLM provider adapters used by agent execution.
# Each provider maps to a driver (openai_native or openai_compatible) and references
# environment variables for API keys and base URLs.
#
# Exactly one provider must set default_for_runner: true.
# API key values are NEVER stored here — only env var names.
#
# Used by: providers_loader.py, config.py (agent model resolution)
# =============================================================================

providers:
  openai:
    driver: openai_native
    api_key_env: OPENAI_API_KEY
    base_url_env: OPENAI_BASE_URL
    api_mode: responses
    default_for_runner: true
    supports:
      parallel_tool_calls: true

  gemini:
    driver: openai_compatible
    api_key_env: GEMINI_API_KEY
    base_url_env: GEMINI_BASE_URL
    default_base_url: https://generativelanguage.googleapis.com/v1beta/openai/
    api_mode: chat_completions
    supports:
      parallel_tool_calls: true

  groq:
    driver: openai_compatible
    api_key_env: GROQ_API_KEY
    base_url_env: GROQ_BASE_URL
    default_base_url: https://api.groq.com/openai/v1
    api_mode: chat_completions
    supports:
      parallel_tool_calls: true

  openrouter:
    driver: openai_compatible
    api_key_env: OPENROUTER_API_KEY
    default_base_url: https://openrouter.ai/api/v1
    api_mode: chat_completions
    optional_for_runtime: true
    supports:
      parallel_tool_calls: true
    request:
      omit_usage_request: true
      headers:
        X-OpenRouter-Metadata: enabled
      extra_body:
        provider:
          allow_fallbacks: false
          require_parameters: true
      forbidden_fields:
        - models
        - fallbacks
    telemetry:
      adapter: openrouter
