models:
  - model_id: gpt-6-astra
    name: GPT-6 Astra
    provider: openai
    description: Reasoning model for routing, output, and explicitly selected document extraction.
    guidance: Default for routing and output agents, with low reasoning. Available for extraction agents by explicit selection; new extraction agents use GPT-5.6 Sol with medium reasoning. Agent Studio AI Chat uses medium reasoning separately.
    default: false
    curator_visible: true
    supports_reasoning: true
    supports_temperature: false
    reasoning_options: [low, medium, high, xhigh]
    default_reasoning: low
    reasoning_descriptions:
      low: Default for routing and output agents, and when Astra is explicitly selected.
      medium: More reasoning for complex instructions or ambiguous evidence.
      high: Deeper reasoning for difficult evidence synthesis.
      xhigh: Most intensive supported setting in this application; use for especially difficult cases.
    recommended_for:
      - Routing and formatting extracted information
      - Paper extraction when explicitly selected
    avoid_for:
      - Routine validation and database lookups where Terra is the default

  - model_id: gpt-5.6-sol
    name: GPT-5.6 Sol
    provider: openai
    description: Default reasoning model for document extraction and curation.
    guidance: Default for new extraction agents. Start with medium reasoning; increase it when difficult evidence needs more analysis. Existing saved agents retain their saved settings; GPT-6 Astra is available by explicit selection.
    default: true
    supports_reasoning: true
    supports_temperature: false
    reasoning_options:
      - low
      - medium
      - high
      - xhigh
    default_reasoning: medium
    reasoning_descriptions:
      low: Fastest GPT-5.6 Sol mode. Good for quick checks and straightforward extraction.
      medium: Default for extraction and curation. Start here when designing a new agent.
      high: Deep reasoning for hard ambiguity.
      xhigh: Deepest reasoning but slowest. Use sparingly for hard ambiguity, not routine DB lookups.
    recommended_for:
      - Complex evidence synthesis and conflict resolution
      - Document extraction and high-stakes interpretation where instruction fidelity matters
      - Prompt architecture or policy refinement
    avoid_for:
      - Simple database retrieval tasks where latency is the priority

  - model_id: gpt-5.6-terra
    name: GPT-5.6 Terra
    provider: openai
    description: Faster, lower-cost reasoning model for validation and lightweight tasks.
    guidance: Use for validation and utility agents where speed matters but reasoning still helps. Use GPT-5.6 Sol for new document extraction agents.
    default: false
    supports_reasoning: true
    supports_temperature: false
    reasoning_options:
      - low
      - medium
      - high
      - xhigh
    default_reasoning: medium
    reasoning_descriptions:
      low: Fastest GPT-5.6 Terra mode. Good for simple lookups.
      medium: Balanced Terra reasoning for routine validation.
      high: Deeper Terra reasoning for validation ambiguity.
      xhigh: Maximum Terra reasoning for difficult validation ambiguity for difficult cases.
    recommended_for:
      - Validation and lightweight extraction
      - Follow-up checks after using search/read tools
    avoid_for:
      - Deep multi-step adjudication with conflicting evidence

  - model_id: deepseek/deepseek-v4-pro-0813
    name: DeepSeek V4 Pro 0813 (OpenRouter)
    provider: openrouter
    description: Explicit non-default OpenRouter route for controlled evaluation.
    guidance: Select explicitly when evaluating the OpenRouter route; OpenAI remains the default.
    default: false
    supports_reasoning: true
    supports_temperature: true
    recommended_for:
      - Explicit OpenRouter route evaluation
    avoid_for:
      - Work that must remain on the default OpenAI route

  - model_id: google/gemini-3.7-flash
    name: Gemini 3.7 Flash (OpenRouter)
    provider: openrouter
    description: Fast multimodal model for responsive agentic workflows and multi-step reasoning.
    guidance: Select explicitly when evaluating this OpenRouter route; OpenAI remains the default.
    default: false
    supports_reasoning: true
    supports_temperature: true
    recommended_for:
      - Explicit OpenRouter route evaluation
    avoid_for:
      - Work that must remain on the default OpenAI route

  - model_id: qwen/qwen3.8-27b
    name: Qwen3.8 27B (OpenRouter)
    provider: openrouter
    description: Open-weight multimodal model for coding, research, and long-running agent tasks.
    guidance: Select explicitly when evaluating this OpenRouter route; OpenAI remains the default.
    default: false
    supports_reasoning: true
    supports_temperature: true
    recommended_for:
      - Explicit OpenRouter route evaluation
    avoid_for:
      - Work that must remain on the default OpenAI route

  # gpt-4o is intentionally NOT registered. It is retired; do not re-add it.
  # Alembic migration lineage moves persisted retired OpenAI model IDs forward
  # to the supported model catalog; do not re-add compatibility entries.
