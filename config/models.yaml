models:
  - model_id: gpt-6-astra
    name: GPT-6 Astra
    provider: openai
    context_window_tokens: 1050000
    max_input_tokens: 922000
    max_output_tokens: 128000
    description: Used by Agent Studio AI Chat. Available for document extraction by explicit selection.
    guidance: Agent Studio AI Chat uses GPT-6 Astra with medium reasoning. Routing, output, extraction and validation agents use GPT-6.1 Sol by default; Astra is available for extraction agents by explicit selection.
    default: false
    curator_visible: true
    supports_reasoning: true
    supports_temperature: false
    supports_tool_search: true
    reasoning_options: [low, medium, high, xhigh]
    default_reasoning: low
    reasoning_descriptions:
      low: Fastest GPT-6 Astra mode, for when Astra is explicitly selected.
      medium: More reasoning for complex instructions or ambiguous evidence.
      high: Deeper reasoning for difficult evidence synthesis.
      xhigh: Most intensive supported setting in this application; use for especially difficult cases.
    recommended_for:
      - Agent Studio AI Chat
      - Paper extraction when explicitly selected
    avoid_for:
      - Routing, formatting, validation and database lookups, where GPT-6.1 Sol is the default

  - model_id: gpt-6.1-sol
    name: GPT-6.1 Sol
    provider: openai
    context_window_tokens: 1050000
    max_input_tokens: 922000
    max_output_tokens: 128000
    description: Default reasoning model for document extraction, validation, routing, output, and curation.
    guidance: Default for new extraction agents, validation and utility agents, the supervisor, and output formatters. Start with medium reasoning for extraction; routing and output agents use low. GPT-6 Astra is available by explicit selection.
    default: true
    supports_reasoning: true
    supports_temperature: false
    supports_tool_search: true
    reasoning_options:
      - low
      - medium
      - high
    default_reasoning: medium
    reasoning_descriptions:
      low: Fastest GPT-6.1 Sol mode. Good for quick checks, simple lookups, and straightforward extraction.
      medium: Default for extraction, validation, and curation. Start here when designing a new agent.
      high: Deepest reasoning offered here. Use for hard ambiguity in extraction or validation, not routine DB lookups.
    recommended_for:
      - Document extraction and high-stakes interpretation where instruction fidelity matters
      - Validation and database lookups after using search/read tools
      - Complex evidence synthesis and conflict resolution
    avoid_for:
      - Agent Studio AI Chat, which uses GPT-6 Astra

  - model_id: deepseek/deepseek-v4-pro-0813
    name: DeepSeek V4 Pro 0813 (OpenRouter)
    provider: openrouter
    description: Explicit non-default OpenRouter route for controlled evaluation.
    guidance: Select explicitly when evaluating the OpenRouter route; OpenAI remains the default.
    default: false
    supports_reasoning: true
    supports_temperature: true
    supports_tool_search: false
    recommended_for:
      - Explicit OpenRouter route evaluation
    avoid_for:
      - Work that must remain on the default OpenAI route

  - model_id: google/gemini-3.7-flash
    name: Gemini 3.7 Flash (OpenRouter)
    provider: openrouter
    description: Fast multimodal model for responsive agentic workflows and multi-step reasoning.
    guidance: Select explicitly when evaluating this OpenRouter route; OpenAI remains the default.
    default: false
    supports_reasoning: true
    supports_temperature: true
    recommended_for:
      - Explicit OpenRouter route evaluation
    avoid_for:
      - Work that must remain on the default OpenAI route

  - model_id: qwen/qwen3.8-27b
    name: Qwen3.8 27B (OpenRouter)
    provider: openrouter
    description: Open-weight multimodal model for coding, research, and long-running agent tasks.
    guidance: Select explicitly when evaluating this OpenRouter route; OpenAI remains the default.
    default: false
    supports_reasoning: true
    supports_temperature: true
    recommended_for:
      - Explicit OpenRouter route evaluation
    avoid_for:
      - Work that must remain on the default OpenAI route

  # gpt-4o is intentionally NOT registered. It is retired; do not re-add it.
  # Alembic migration lineage moves persisted retired OpenAI model IDs forward
  # to the supported model catalog; do not re-add compatibility entries.
