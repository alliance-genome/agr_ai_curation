server {
    listen 8080;
    server_name _;
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $cost_backend http://backend:8000;
    root /usr/share/nginx/html;
    absolute_redirect off;
    location = /health { access_log off; return 200 'ok'; }
    location = /cost { return 308 /cost/; }
    location = /_cost_access {
        internal;
        proxy_pass $cost_backend/api/admin/cost/access;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Cookie $http_cookie;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header Host $host;
    }
    location /cost/ {
        auth_request /_cost_access;
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options nosniff always;
        try_files $uri /cost/cost.html;
        error_page 401 = @signin;
    }
    location @signin {
        default_type text/html;
        add_header Cache-Control "no-store" always;
        return 401 '<!doctype html><html lang="en"><title>Sign in required</title><h1>Admin sign-in required</h1><p><a href="/api/auth/login?destination=cost">Sign in to AI Curation</a> to continue.</p></html>';
    }
    location / { return 404; }
}
