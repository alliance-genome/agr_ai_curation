services:
  frontend:
    build: ./frontend
    ports:
      - "${TRACE_REVIEW_FRONTEND_HOST_PORT:-3001}:80"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - TRACE_REVIEW_PUBLIC_API_URL=${TRACE_REVIEW_PUBLIC_API_URL:-http://host.docker.internal:${TRACE_REVIEW_BACKEND_HOST_PORT:-8001}}
      - VITE_DEV_MODE=${VITE_DEV_MODE:-false}
    depends_on:
      - backend

  backend:
    build:
      context: ..
      dockerfile: trace_review/backend/Dockerfile
    network_mode: host  # Use host network to access VPN (EC2 Langfuse)
    # Canonical input: Compose --env-file (or exported shell variables).
    # Service env_file is deliberately absent: it cannot supply interpolation
    # values and would be shadowed by the environment entries below.
    environment:
      # Langfuse config comes from .env (supports both local and remote sources)
      # - source="remote" uses LANGFUSE_HOST (EC2 VPN)
      # - source="local" uses LANGFUSE_LOCAL_HOST (host.docker.internal)
      - DEV_MODE=${DEV_MODE:-false}
      # Shared auth runtime settings, including this service's callback URI.
      - AUTH_PROVIDER=${AUTH_PROVIDER}
      - OIDC_ISSUER_URL=${OIDC_ISSUER_URL:-}
      - OIDC_CLIENT_ID=${OIDC_CLIENT_ID:-}
      - OIDC_CLIENT_SECRET=${OIDC_CLIENT_SECRET:-}
      - OIDC_REDIRECT_URI=${OIDC_REDIRECT_URI:-http://localhost:${TRACE_REVIEW_FRONTEND_HOST_PORT:-3001}/api/auth/callback}
      - OIDC_SCOPES=${OIDC_SCOPES:-openid profile email}
      - OIDC_GROUP_CLAIM=${OIDC_GROUP_CLAIM:-groups}
      - OIDC_LOGOUT_URL=${OIDC_LOGOUT_URL:-}
      - OIDC_LOGOUT_REDIRECT_PARAM=${OIDC_LOGOUT_REDIRECT_PARAM:-post_logout_redirect_uri}
      - COGNITO_REGION=${COGNITO_REGION:-us-east-1}
      - COGNITO_USER_POOL_ID=${COGNITO_USER_POOL_ID:-}
      - COGNITO_CLIENT_ID=${COGNITO_CLIENT_ID:-}
      - COGNITO_CLIENT_SECRET=${COGNITO_CLIENT_SECRET:-}
      - COGNITO_DOMAIN=${COGNITO_DOMAIN:-https://auth.alliancegenome.org}
      - COGNITO_REDIRECT_URI=${COGNITO_REDIRECT_URI:-http://localhost:${TRACE_REVIEW_FRONTEND_HOST_PORT:-3001}/api/auth/callback}
      - SECURE_COOKIES=${SECURE_COOKIES:-false}
      - AUTH_PROVIDER_TIMEOUT_SECONDS=${AUTH_PROVIDER_TIMEOUT_SECONDS:-10}
      - AUTH_JWKS_TIMEOUT_SECONDS=${AUTH_JWKS_TIMEOUT_SECONDS:-30}
      - AUTH_JWKS_CACHE_TTL_SECONDS=${AUTH_JWKS_CACHE_TTL_SECONDS:-300}
      - AUTH_OAUTH_COOKIE_MAX_AGE_SECONDS=${AUTH_OAUTH_COOKIE_MAX_AGE_SECONDS:-600}
      - AUTH_SESSION_COOKIE_MAX_AGE_SECONDS=${AUTH_SESSION_COOKIE_MAX_AGE_SECONDS:-86400}
      - CACHE_TTL_HOURS=1
      - TRACE_REVIEW_TRANSIENT_CACHE_TTL_SECONDS=${TRACE_REVIEW_TRANSIENT_CACHE_TTL_SECONDS:-15}
      - BACKEND_PORT=${TRACE_REVIEW_BACKEND_HOST_PORT:-8001}
      - FRONTEND_URL=${TRACE_REVIEW_FRONTEND_URL:-http://localhost:${TRACE_REVIEW_FRONTEND_HOST_PORT:-3001}}
      - LANGFUSE_HOST=${LANGFUSE_HOST:-}
      - LANGFUSE_PUBLIC_KEY=${LANGFUSE_PUBLIC_KEY:-}
      - LANGFUSE_SECRET_KEY=${LANGFUSE_SECRET_KEY:-}
      - LANGFUSE_LOCAL_HOST=${LANGFUSE_LOCAL_HOST:-http://host.docker.internal:3000}
      - LANGFUSE_LOCAL_PUBLIC_KEY=${LANGFUSE_LOCAL_PUBLIC_KEY:-}
      - LANGFUSE_LOCAL_SECRET_KEY=${LANGFUSE_LOCAL_SECRET_KEY:-}
      - AI_CURATION_BACKEND_URL=${AI_CURATION_BACKEND_URL:-}
      - TRACE_REVIEW_SENTRY_DSN=${TRACE_REVIEW_SENTRY_DSN:-}
      - TRACE_REVIEW_SENTRY_ENVIRONMENT=${TRACE_REVIEW_SENTRY_ENVIRONMENT:-local}
      - TRACE_REVIEW_SENTRY_RELEASE=${TRACE_REVIEW_SENTRY_RELEASE:-}
      - TRACE_REVIEW_INTERNAL_API_TOKEN=${TRACE_REVIEW_INTERNAL_API_TOKEN:-}
      - EXTRACTION_TRACE_EVENT_DIR=${EXTRACTION_TRACE_EVENT_DIR:-/app/extraction_trace_events}
    volumes:
      - ../extraction_trace_events:/app/extraction_trace_events

  backend-tests:
    profiles:
      - test
    build:
      context: ..
      dockerfile: trace_review/backend/Dockerfile
      target: test
