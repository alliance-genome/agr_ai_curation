group_id: MGI
content: |
  ## MGI-SPECIFIC RULES (Mus musculus)

  ### Discover candidates from the paper's names

  Keep literal-name and database-synonym searches. Do not infer a different biological
  name from memory: search `BMAL1`, not an assumed `Arntl`; search `p53`, not an
  assumed `Trp53`. Use database-supported gene aliases to establish gene scope,
  not to establish a specific allele's identity.

  #### Strip Genotype Notation Before Searching

  For candidate discovery, separate explicit genotype notation from the named entity:

  | Paper notation | Discovery query | Context to retain |
  |---|---|---|
  | Gene fl/fl or flox/flox | Gene | floxed, homozygous |
  | Gene -/- | Gene | reported knockout/null, homozygous |
  | Gene +/- | Gene | heterozygous; no specific allele design established |
  | Gene +/+ | Gene | wild type; do not invent a mutant allele |

  Strip a tissue/experimental prefix only when the source establishes that meaning
  (e.g. `csBMAL1` described as cardiac-specific BMAL1). Preserve the original mention
  and its experimental context; do not strip characters from an official designation.
  State the literal mention, discovery query, and retained design clues briefly.

  ### Synonym matches identify candidates, not confirmed alleles

  For MGI allele identity, an exact synonym match—even a unique result—is insufficient
  by itself to resolve an allele. Require independent, paper-supported information
  linking the mention to the specific database allele: an explicit allele identifier,
  a full official allele designation, or distinguishing molecular or repository
  information corroborated by the database.

  Matching gene, species, and generic knockout or floxed wording can narrow candidates
  but does not establish the specific allele. Fetching a synonym-matched candidate by
  its ID confirms that the record exists; it is not independent evidence connecting
  it to the paper. This applies even when no conflicting clue is apparent.

  A source-supplied explicit allele ID or full official designation can support direct
  validation; it need not be accompanied by a paper quote. Distinguish it from an ID
  learned only through candidate discovery. Compare all supplied distinguishing clues
  and explain material discrepancies before resolving.

  Without distinguishing support, return unresolved, retain plausible candidates,
  and explain what information is missing—even if only one candidate remains.
  Follow the active runtime's result contract; do not force a selection.

  ### Selecting from Multiple Search Results

  Use `matched_on`, official symbol, gene, allele design, and attribution to assess
  candidates. A discovery match is not an identity decision:

  | Paper notation | Candidate clue | Identity decision without independent support |
  |---|---|---|
  | fl/fl, flox/flox | compatible floxed design | unresolved; retain plausible candidates |
  | -/-, null | compatible reported null design | unresolved; retain plausible candidates |
  | +/- | zygosity only | unresolved; does not select an allele design |

  A matching design can be shared by several independently generated alleles. Compare
  the actual design and experimental context rather than selecting by a substring.

  ### Consistent examples

  - **BMAL1 fl/fl cardiac-specific mice:** search `BMAL1` with `data_provider="MGI"`.
    A floxed synonym hit is a plausible candidate; generic fl/fl wording does not
    independently identify it. Even a unique hit remains unresolved without a
    distinguishing source identifier, official designation, or corroborated design
    or repository detail. Do not select `Arntl<sup>tm1Bra</sup>` merely because
    BMAL1 is a synonym and the candidate is floxed.
  - **p53 -/- knockout mice:** search `p53` with `data_provider="MGI"`. A null
    synonym hit remains a candidate, unresolved without independent identifying
    support. Fetching its returned ID does not supply that support.
  - **Independent identifying support:** when the paper supplies a specific allele
    ID or full official designation, validate that source-supplied value against the
    database and other clues. A repository/catalog reference or molecular design
    supports resolution only when corroboration links it to the specific allele;
    generic knockout/floxed wording is still insufficient.

  ### Lab-code and attribution clues

  MGI engineered allele superscripts can include creator/institution lab codes, such
  as `Hko`, `Cya`, or `Gpt`. Use source-supplied tokens and database
  `fullname_attribution` to refine discovery; do not invent a full allele designation
  or infer paper identity from a code, surname, company, or author list alone.

  When supplier information is available, use it as a separate `allele_attribution`
  clue to refine candidate discovery. Keep the allele name and gene scope separate.
  A supplier may distribute an allele created by another laboratory: supplier and
  creator are distinct roles. An attribution match alone is a clue, not confirmation;
  a mismatch needs explanation, not automatic rejection. Missing attribution is
  unknown. Do not invent supplier/catalog connections.

  Check gene, species, allele design, and supplier or originating laboratory against
  all supplied source clues. If the connection cannot be established, retain
  plausible candidates and return unresolved, stating the missing source/catalog,
  full designation, or distinguishing design evidence. Do not surface unrelated-gene
  hits merely because they share attribution text.

  Report the searches performed, candidate evidence, independent identifying support
  (or its absence), material discrepancies, and the resolved/unresolved decision
  concisely through the active result contract.
