# Curator-facing documentation for the Allele Validation Agent.
summary: "Validates allele/variant identifiers against the Alliance Curation Database by symbol, ID, or gene association."
capabilities:
  - name: "Allele search (partial match)"
    description: "Search for alleles by symbol — partial symbols, synonyms, and any capitalization all work."
    example_query: "Find all Ulk1 alleles in mouse"
    example_result: "Returns all alleles matching 'Ulk1' (e.g., Ulk1<sup>tm1Thsn</sup>) with IDs, symbols, names, and species"
  - name: "Exact symbol lookup"
    description: "Find an allele by its exact official symbol. You can paste it the way it appears in a paper (for example Ulk1<tm1Thsn>) and it is matched automatically to the official superscript form."
    example_query: "Find the allele Ulk1<tm1Thsn>"
    example_result: "Returns the exact matching allele with full details including MGI:3689906"
  - name: "Allele ID lookup"
    description: "Retrieve allele details directly by Alliance CURIE"
    example_query: "Tell me about MGI:3689906"
    example_result: "Returns allele symbol, name, species, and status for the given ID"
  - name: "Batch validation"
    description: "Look up multiple alleles in a single request"
    example_query: "Look up these alleles: e1370, n765, tm1234"
    example_result: "Returns validation results for each allele, with not_found list for any missing"
data_sources:
  - name: "Alliance Curation Database (AGR)"
    description: "Comprehensive allele/variant data from all Model Organism Databases, including symbols, names, synonyms, obsolete status, and extinction status"
    species_supported: ["C. elegans (WB)", "D. melanogaster (FB)", "D. rerio (ZFIN)", "H. sapiens (HGNC)", "M. musculus (MGI)", "R. norvegicus (RGD)", "S. cerevisiae (SGD)"]
    data_types: ["allele symbols", "allele IDs (CURIEs)", "full names", "synonyms", "gene associations", "obsolete/extinct status"]
note: "Validation runs automatically. This check runs on every allele an extractor produces, so you do not need to set it up yourself. Clone it in the Agent Workshop when you want a custom version with a changed prompt or different tools."
use_when:
  - "When you want a custom allele check: a changed prompt, different tools, or a stricter or looser match than the automatic check."
  - "When you have an allele symbol or ID and want to confirm it exists and see the gene it belongs to."
  - "When you want to review how alleles in extracted records are confirmed against Alliance records."
avoid_when:
  - "To get alleles validated in a flow; the domain pack already runs this check automatically on every allele an extractor produces."
  - "For genes; use the Gene Validation Agent."
  - "For diseases or phenotypes; use the Disease Ontology Agent or the phenotype validators."
  - "To find the alleles a paper studies; that is the Allele/Variant Extraction Agent's job."
limitations:
  - "Only validates against Alliance group data - newly published alleles may not be in the database yet"
  - "Allele symbols written with angle brackets are matched to their superscript form automatically — you don't need to reformat them."
  - "Very broad searches return at most 500 matches (100 by default), so narrow your search if you don't see the allele you expect."
