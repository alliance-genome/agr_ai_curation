# Curator-facing documentation for the Gene Validation Agent.
summary: "Validates gene identifiers against the Alliance Curation Database."
capabilities:
  - name: "Gene lookup"
    description: "Find genes by symbol, name, ID, or cross-reference"
    example_query: "Look up the gene daf-16"
    example_result: "Returns gene ID, symbol, name, species, and synonyms"
  - name: "Batch validation"
    description: "Validate multiple genes at once"
    example_query: "Look up these genes: daf-16, lin-3, unc-54, act-1"
    example_result: "Returns validation results for each gene"
data_sources:
  - name: "Alliance Curation Database"
    description: "Comprehensive gene data from all MODs"
    species_supported:
      - "C. elegans"
      - "D. melanogaster"
      - "D. rerio"
      - "H. sapiens"
      - "M. musculus"
      - "R. norvegicus"
      - "S. cerevisiae"
    data_types: ["genes", "symbols", "synonyms", "cross-references"]
use_when:
  - "When you want a custom gene check: a changed prompt, different tools, or a stricter or looser match than the automatic check."
  - "When you have a gene symbol, name, or ID and want to confirm it exists and get its Alliance identifier."
  - "When you want to review how genes in extracted records are confirmed, or need a confirmed gene ID before an ortholog lookup."
avoid_when:
  - "To get genes validated in a flow; the domain pack already runs this check automatically on every gene an extractor produces."
  - "For alleles or variants; use the Allele Validation Agent."
  - "For diseases, chemicals, or ontology terms; use the matching validation agent."
  - "To find the genes a paper studies; that is the Gene Extraction Agent's job."
limitations:
  - "Only validates against Alliance group data"
  - "Some newly published genes may not be in the database yet"
