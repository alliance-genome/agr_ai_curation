# =============================================================================
# AGENT DEFINITION: go_annotations
# =============================================================================
# Retrieves existing GO annotations for specific genes.
# Tool name generated at runtime: ask_go_annotations_specialist
# =============================================================================

# -----------------------------------------------------------------------------
# BASIC INFORMATION
# -----------------------------------------------------------------------------
agent_id: go_annotations_lookup

name: "Gene GO Annotations Agent"

description: >
  Retrieves typed existing GO annotations from the Gene Ontology Consortium API.
  Returns curator-comparison fields with source-record provenance.

category: "Validation"
subcategory: "Data Validation"

# -----------------------------------------------------------------------------
# SUPERVISOR ROUTING
# -----------------------------------------------------------------------------
# Tool name is generated at runtime as: ask_{folder}_specialist
supervisor_routing:
  enabled: true
  description: >
    Use for retrieving existing GO annotations for specific genes, finding
    evidence, references, With/From, qualifiers, or source provenance.
  batchable: true
  batching_instructions: >
    When getting annotations for multiple genes, combine them into a single request.
    Example: "Get GO annotations for: WB:WBGene00000912, WB:WBGene00001234, etc."

# -----------------------------------------------------------------------------
# TOOLS
# -----------------------------------------------------------------------------
tools:
  - go_api_call

# -----------------------------------------------------------------------------
# OUTPUT SCHEMA
# -----------------------------------------------------------------------------
output_schema: GOAnnotationsResult
output_projection:
  row_list_field: annotations
  identity_fields: [go_id]
  label_fields: [go_name, gene_symbol]
  inherited_parent_fields: [gene_id, gene_symbol]
structured_finalization:
  enabled: true
  tool_name: finalize_go_annotations_lookup
  checks:
    - lookup_provenance
  lookup:
    tool_name: go_api_call
    provider_terms: [go_api_call, geneontology, go consortium, go annotations]
    request_keys: [gene_id, gene_ids]
    result_collections: [gene_id, annotations]
    resolved_fact_paths:
      - "annotations[]"
    fact_identity_paths:
      - "annotations[].go_id"
      - "annotations[].object_id"
      - "annotations[].id"
    fact_fidelity_paths:
      - "annotations[]"

# -----------------------------------------------------------------------------
# MODEL CONFIGURATION
# -----------------------------------------------------------------------------
model_config:
  model: "${AGENT_GO_ANNOTATIONS_MODEL:-gpt-5.6-terra}"
  temperature: 0.1
  reasoning: "medium"

# -----------------------------------------------------------------------------
# EXECUTION REQUIREMENTS
# -----------------------------------------------------------------------------
requires_document: false
required_params: []

batch_capabilities: []

# -----------------------------------------------------------------------------
# FRONTEND DISPLAY
# -----------------------------------------------------------------------------
frontend:
  icon: "📎"
  show_in_palette: true

# -----------------------------------------------------------------------------
# GROUP RULES
# -----------------------------------------------------------------------------
group_rules_enabled: false
