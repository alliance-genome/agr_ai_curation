# Curator-facing documentation for the GO Annotations Lookup Agent.
summary: "Retrieves typed existing GO annotations for specific genes from the Gene Ontology Consortium API with complete curator-comparison provenance."
capabilities:
  - name: "Gene annotation lookup"
    description: "Retrieve existing GO annotations for a validated gene CURIE, showing term, aspect, evidence, references, relation, With/From, qualifiers, negation, provider, product type, and source-record provenance"
    example_query: "What GO annotations exist for WB:WBGene00000898?"
    example_result: "Returns annotations like GO:0003677 (DNA binding) with evidence code IDA, assigned by WB"
  - name: "Annotation provenance"
    description: "Preserve the reference, evidence code and ECO identifier, With/From values, provider, and exact source record used for comparison"
    example_query: "Show the provenance behind the existing annotations for RGD:620474"
    example_result: "Returns RGD annotations with references, ECO evidence, With/From identifiers, provider, product type, and GO Consortium source records"
  - name: "Batch annotation retrieval"
    description: "Retrieve GO annotations for multiple genes in a single request"
    example_query: "Get GO annotations for: WB:WBGene00000912, WB:WBGene00001234"
    example_result: "Returns a typed annotation result for each validated gene request"
  - name: "GO aspect classification"
    description: "Categorize annotations by GO aspect: Molecular Function (MF), Biological Process (BP), or Cellular Component (CC)"
    example_query: "What molecular functions does this gene have?"
    example_result: "Returns the matching annotations grouped by GO category, each with its GO ID, term name, and evidence"
data_sources:
  - name: "Gene Ontology Consortium API"
    description: "Official GO API at api.geneontology.org providing gene annotations with evidence codes"
    species_supported: ["C. elegans (WB:)", "D. melanogaster (FB:)", "D. rerio (ZFIN:)", "H. sapiens (HGNC:)", "M. musculus (MGI:)", "R. norvegicus (RGD:)", "S. cerevisiae (SGD:)"]
    data_types: ["GO annotations", "evidence and ECO identifiers", "references", "relations", "With/From", "qualifiers and negation", "providers", "product types", "source provenance"]
limitations:
  - "Gene IDs must be in Alliance format (e.g., WB:WBGene00000898, HGNC:11998)"
  - "Cannot search for GO terms by keyword - use Gene Ontology Lookup Agent for that"
  - "Cannot find genes by GO term (e.g., 'what genes have kinase activity')"
  - "Cannot explore GO term hierarchy or parent/child relationships"
  - "The adapter makes one bounded request to the Gene Ontology Consortium API and does not fall back to another source"
