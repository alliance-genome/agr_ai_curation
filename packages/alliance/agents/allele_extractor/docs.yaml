# Curator-facing documentation for the Allele Extractor Agent.
summary: "Extracts experimentally supported allele and variant mentions from uploaded PDFs, distinguishing alleles from strains, transgenes, and balancers."
capabilities:
  - name: "Allele/variant candidate harvesting"
    description: "Scans the whole paper for allele symbols, variant notations (including HGVS, the standard way of writing sequence variants), and genotype descriptions."
    example_query: "Extract all alleles from this paper"
    example_result: "Returns allele candidates with exact notation as written, associated gene, and organism context"
  - name: "Entity classification"
    description: "Distinguishes alleles from strains, transgene constructs, balancer chromosomes, and chromosomal deficiencies using organism-specific nomenclature rules"
    example_query: "Extract alleles from this C. elegans genetics paper"
    example_result: "Correctly classifies daf-2(e1370) as an allele while excluding N2 (strain) and muEx225 (transgene array)"
  - name: "Genotype string parsing"
    description: "Parses composite genotype strings into individual alleles (e.g., 'daf-2(e1370); daf-16(mu86)' becomes two separate entries)"
    example_query: "Parse the genotypes in this paper's strain table"
    example_result: "Returns individual alleles with gene associations and allele type classification"
  - name: "Hands alleles to the validator"
    description: "Passes each proposed allele — with its exact notation, its likely gene, the organism, and the supporting quote — to the Allele Validation Agent, the stronger specialist that authoritatively confirms each one against the Alliance database. The extractor proposes; the validator confirms and settles the official allele ID."
    example_query: "Extract the alleles and pass them on for confirmation"
    example_result: "Returns each proposed allele with its exact notation and supporting quote, ready for the Allele Validation Agent to confirm"
data_sources:
  - name: "PDF Document Search (Weaviate)"
    description: "Hybrid semantic/keyword plus lexical-heavy search modes over uploaded PDF documents"
    species_supported: null
    data_types: ["PDF text chunks", "Section content", "Subsection content"]
note: "The domain pack's validators run automatically on everything this agent extracts: each allele and the paper reference. You only need to add a validator to the flow if you want custom validation."
use_when:
  - "When you upload a paper and want the alleles and variants it studies, with the quote that supports each one."
  - "At the start of an allele curation flow; the domain pack's validators then confirm each allele automatically."
  - "When a paper mixes alleles with strains, transgenes, and balancers and you want them sorted."
avoid_when:
  - "To confirm an allele against the Alliance database; the domain pack's validators do that automatically on everything this agent extracts."
  - "For genes, diseases, or phenotypes; use the matching extraction agent."
  - "When there is no uploaded paper, since it cannot work from chat text alone."
limitations:
  - "Requires an uploaded PDF document — cannot extract alleles from chat text alone"
  - "Transgene handling follows organism-specific rules: MGI retains stable inherited Cre-driver, reporter, and other transgenic lines as alleles, while transient expression and unlinked construct/reagent mentions are excluded"
  - "Balancer chromosomes and chromosomal deficiencies are classified as tools, not alleles"
