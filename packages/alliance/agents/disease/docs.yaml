# Curator-facing documentation for the Disease Ontology Agent (agent_id disease_validation).
summary: "Can look up Disease Ontology (DOID) terms by name, synonym, or ID, but is not used anywhere at present: no check attaches it and AI Chat cannot call it."
capabilities:
  - name: "Disease name lookup"
    description: "Finds the DOID for a disease name, ignoring capitalization"
    example_query: "Alzheimer's disease"
    example_result: "DOID:10652 with its name, definition, and synonyms"
  - name: "DOID lookup"
    description: "Retrieves a disease term by its DOID"
    example_query: "DOID:14330"
    example_result: "Parkinson's disease with its definition and synonyms"
  - name: "Synonym search"
    description: "Finds a disease by one of its synonyms when the exact name does not match"
    example_query: "Alzheimers dementia"
    example_result: "DOID:10652 through a synonym match"
data_sources:
  - name: "Alliance disease term records"
    description: "The Alliance's curated copy of the Disease Ontology — official disease names, their IDs, definitions, and synonyms."
    species_supported: null
    data_types: ["disease terms", "DOIDs", "definitions", "synonyms"]
note: "This agent is not used anywhere at present: no domain pack attaches it and AI Chat cannot call it. The disease term on an extracted record is confirmed automatically by the Ontology Term Resolver Agent, and in chat you can look a disease up through that agent."
use_when: []
avoid_when:
  - "For gene to disease associations; those come from the Disease Extraction Agent, and the genes on its records are checked automatically by the Gene Validation Agent."
  - "For disease vocabularies other than the Disease Ontology."
  - "For disease prevalence or statistics."
limitations:
  - "Does not walk up or down the disease hierarchy (parent or child terms) and does not track a term's obsolete history."
  - "Every answer comes from a live lookup against the Alliance's disease terms — it never answers from memory."
