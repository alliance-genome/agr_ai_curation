summary: >
  Authenticated RGD-only extraction specialist for evidence-backed GO
  recommendations from one active paper.
capabilities:
  - name: Evidence-backed GO paper review
    description: >
      Reads Results, Methods, figures, and tables for named rat gene products and
      produces review-only GO recommendations with exact document evidence.
    example_query: "Review Cttn and discover any additional GO-curatable genes in this paper."
    example_result: >
      Returns typed GOCuratableObject recommendations with the paper's wording for
      the gene product, GO term, evidence code, reference, and With/From, any
      identifiers the paper prints, a rationale, and evidence anchors. Validation
      confirms each identity afterwards.
data_sources:
  - name: Active paper evidence
    description: Verified PDF chunks and backend-owned evidence anchors from the active document.
    species_supported: ["R. norvegicus (RGD)"]
    data_types: ["Results", "Methods", "Figure legends", "Tables"]
use_when:
  - "When you are an RGD curator with a paper open and want evidence-backed GO recommendations from it."
avoid_when:
  - "To check recommendations against the RGD evidence policy; that check runs automatically on everything this agent produces."
  - "For curators outside RGD; the agent works only in the RGD group."
  - "For GO term definitions or hierarchy on their own; use the GO Term Lookup Agent."
  - "To submit or export GO annotations; the output is for review only."
limitations:
  - "Introduction and Discussion are excluded as sole recommendation evidence."
  - "Mature-RNA ambiguity is never collapsed to a guessed precursor-gene CURIE."
  - "It never looks identities up; it records the paper's wording and any identifiers the paper prints, and validation confirms them."
