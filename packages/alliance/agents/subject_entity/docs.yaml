summary: >
  Routes biological annotation subjects by explicit subject type to gene,
  allele, or affected genomic model validation paths.
capabilities:
  - name: "Subject type routing"
    description: >
      Uses the submitted subject_type to choose the correct validation path
      for gene, allele, or AGM subjects.
    example_query: "Validate this phenotype subject with subject_type allele and ID WB:WBVar0001"
    example_result: >
      Returns the selected validator route and the type-specific validation
      result.
  - name: "Identifier and label preservation"
    description: >
      Keeps the submitted identifier, label, taxon, and field path together
      while validating the subject entity.
    example_query: "Check subject label daf-16 with gene subject type for WormBase"
    example_result: >
      Returns matched gene evidence or unresolved notes tied to the original
      subject field.
  - name: "Per-subject review decisions"
    description: >
      Reports one validation outcome per submitted subject so mixed subject
      batches remain auditable.
    example_query: "Validate these phenotype and disease annotation subjects"
    example_result: >
      Returns accepted, ambiguous, or unresolved subject results with selected
      validator metadata.
data_sources:
  - name: "Alliance Curation Database"
    description: >
      Alliance entity records used by gene, allele, and affected genomic model
      validation routes.
    species_supported:
      - "C. elegans (WB)"
      - "D. melanogaster (FB)"
      - "D. rerio (ZFIN)"
      - "M. musculus (MGI)"
      - "R. norvegicus (RGD)"
      - "S. cerevisiae (SGD)"
      - "X. laevis (XB)"
      - "H. sapiens (HGNC)"
    data_types:
      - "genes"
      - "alleles"
      - "affected genomic models"
      - "entity labels"
      - "taxon context"
note: "Validation runs automatically. This check runs on the subject of every disease and phenotype record an extractor produces, so you do not need to set it up yourself. Clone it in the Agent Workshop when you want a custom version with a changed prompt or different tools."
use_when:
  - "When you want a custom subject check: a changed prompt, different routing, or a stricter or looser match for gene, allele, or model subjects."
  - "When you want to review how an annotation's subject is sent to the gene, allele, or model check and keeps the identifier and label it arrived with."
  - "When you clone it in the Agent Workshop to build a custom version for a check the domain pack does not include."
avoid_when:
  - "To get subjects validated; the domain pack already runs this check automatically on every record that names its subject type."
  - "When the subject type is not stated; the agent does not guess it."
  - "For references, ontology terms, controlled vocabulary, or experimental conditions; use the matching validation agent."
  - "When you already know the subject is a gene, allele, or model; use that validation agent directly."
limitations:
  - "Requires an explicit subject_type; it does not guess whether a value is a gene, allele, or AGM."
  - "Ambiguous or missing type-specific lookup results still require curator review."
  - "Cannot create missing subject records or assign new entity identifiers."
  - "Only routes among the supported subject validation paths exposed by the package."
