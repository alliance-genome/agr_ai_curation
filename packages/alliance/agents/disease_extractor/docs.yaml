# Curator-facing documentation for the Disease Extractor Agent.
summary: "Extracts experimentally supported disease associations from uploaded PDFs, classifying disease roles and gene-disease relationship types for Alliance curation."
capabilities:
  - name: "Disease mention harvesting"
    description: "Scans the paper for disease names, condition descriptions, and disease model references across all sections"
    example_query: "Extract all disease mentions from this paper"
    example_result: "Returns disease candidates with the name as written, role classification, and experimental context"
  - name: "Role classification"
    description: "Categorizes each disease mention as primary subject, background context, comparative reference, or model context"
    example_query: "Extract diseases from this Alzheimer's model paper"
    example_result: "Classifies 'Alzheimer's disease' as primary and 'diabetes' as comparative, with supporting evidence"
  - name: "Gene-disease association typing"
    description: "Uses the relationship allowed for the paper's subject: genes can be is_implicated_in or is_marker_for (including supported orthology variants), alleles can be is_implicated_in, and affected genomic models can be is_model_of, is_ameliorated_model_of or is_exacerbated_model_of."
    example_query: "What gene-disease relationships are reported?"
    example_result: "Returns association types with evidence (e.g., LRRK2 is_implicated_in Parkinson's disease)"
  - name: "Hands diseases to the validator"
    description: "Retains paper wording, the subject kind, relation, provider and supporting quote. Active specialist validators check their assigned fields: the Disease Validation Agent confirms the disease term, and subject validation routes separately to the gene, allele or affected-genomic-model validator. Unresolved checks remain visible for review."
    example_query: "Extract the diseases and pass them on for confirmation"
    example_result: "Returns each proposed disease, its relationship, provider, and subject, with the supporting quote, ready for the Disease Validation Agent to confirm"
data_sources:
  - name: "PDF Document Search (Weaviate)"
    description: "Hybrid semantic/keyword plus lexical-heavy search modes over uploaded PDF documents"
    species_supported: null
    data_types: ["PDF text chunks", "Section content", "Subsection content"]
use_when:
  - "When you upload a paper and want the diseases it links to genes, alleles, or models, with the evidence quote."
  - "At the start of a disease curation flow; the domain pack's validators then confirm each disease term automatically."
  - "When a paper reports a disease model or a new gene to disease finding."
avoid_when:
  - "To confirm disease terms against the Disease Ontology; the domain pack's validators do that automatically on everything this agent extracts."
  - "To look a disease up on its own, outside a paper; use the Disease Ontology Agent."
  - "For observable traits in model organisms; those are phenotypes, so use the Phenotype Extraction Agent."
  - "When there is no uploaded paper, since it cannot work from chat text alone."
limitations:
  - "Requires an uploaded PDF document — cannot extract diseases from chat text alone"
  - "Distinguishes diseases from phenotypes — observable traits in model organisms are phenotypes, not diseases"
  - "Diseases mentioned only in introduction/background without new experimental findings are excluded"
  - "Does not look anything up in the Alliance database: it records the paper's wording, plus an ID only when the paper prints one, and the validators find the official term and subject"
