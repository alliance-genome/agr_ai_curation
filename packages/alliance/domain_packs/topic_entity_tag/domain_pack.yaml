pack_id: agr.alliance.topic_entity_tag
display_name: Topic Entity Tag Proposal Domain Pack
version: 0.1.0
metadata_api_version: 1.0.0
description: Review-only paper-level topic tag proposals that use ABC's own topic-entity-tag fields.
status: in_development
enum_definitions:
  - enum_id: TopicEntityTagTopic
    display_name: Topic
    description: The subject this tag says the paper has data about.
    values:
      - value: ATP:0000041
        label: gene expression in wild type
  - enum_id: TopicEntityTagMod
    display_name: Data provider
    description: ABC data provider the tag belongs to.
    values:
      - value: WB
        label: WB
model_definitions:
  - model_id: TopicEntityTagPayload
    display_name: Topic entity tag payload
    description: ABC topic-entity-tag fields for one proposed paper-level tag.
    definition_state: in_development
    definition_notes:
      - LinkML has no topic/entity-tag model yet, so the contract is ABC's API plus ATP terms.
    metadata:
      display:
        label: topic_name
        id: topic
object_definitions:
  - object_type: topic_entity_tag
    display_name: Topic tag
    description: One proposed paper-level topic tag for a curator to sign off.
    model_ref: TopicEntityTagPayload
    definition_state: in_development
    definition_notes:
      - Review-only proposal for a curator to sign off. Nothing here writes to ABC.
    metadata:
      object_role: curatable_unit
      # The absence of data for a topic cannot be quoted from a paper.
      evidence_optional_when:
        negated: true
      workspace_display:
        review_policy:
          mode: fields
          decision_fields: [negated, note]
        primary_label_field: topic_name
        summary_fields:
          - negated
          - reference_curie
        groups:
          - id: tag
            label: Topic tag
            fields:
              - topic_name
              - topic
              - negated
              - rationale
              - note
              - reference_curie
              - mod_abbreviation
    fields:
      - field_path: topic
        field_type: enum
        display_name: Topic
        required: true
        description: The topic this tag is about. Set by the agent's configuration, not by the AI's reading of the paper.
        enum_ref: TopicEntityTagTopic
        metadata:
          protected: true
          system_filled: true
      - field_path: topic_name
        field_type: string
        display_name: Topic name
        required: true
        description: The readable name of the topic.
        metadata:
          protected: true
          system_filled: true
          exported: false
      - field_path: negated
        field_type: boolean
        display_name: Negated (no data for this topic)
        required: true
        description: False means the paper has data for this topic. True means it does not.
        metadata:
          editable: true
      - field_path: rationale
        field_type: string
        display_name: Rationale
        required: true
        description: The agent's reason for this proposal, including any doubt.
        metadata:
          protected: true
          curator_action_note: Written by the extraction agent; not editable.
          free_text: true
      - field_path: note
        field_type: string
        display_name: Note
        description: An optional note from the curator to keep with the tag.
        metadata:
          editable: true
          free_text: true
      - field_path: reference_curie
        field_type: string
        display_name: ABC reference
        description: The paper's ABC reference ID, from the document record. A paper uploaded with no ABC reference has none, and cannot be submitted to ABC.
        metadata:
          protected: true
          exported: false
      - field_path: mod_abbreviation
        field_type: enum
        display_name: Data provider
        required: true
        description: The ABC data provider this tag belongs to.
        enum_ref: TopicEntityTagMod
        metadata:
          protected: true
          system_filled: true
fixture_packs:
  - fixture_pack_id: wb_gene_expression
    display_name: WB gene-expression topic-tag proposals
    path: fixtures/wb_gene_expression.yaml
    description: One positive and one negated WB gene-expression proposal.
    object_types:
      - topic_entity_tag
metadata:
  object_role_key: object_role
  supported_object_roles:
    - curatable_unit
  validators:
    active: []
  abc_contract:
    literature_service_repository: https://github.com/alliance-genome/agr_literature_service
    literature_service_commit: c4b6436c849aff86c6b7b3914f364b75c606dee5
    schema_files:
      - agr_literature_service/api/schemas/topic_entity_tag_schemas.py
      - agr_literature_service/api/routers/topic_entity_tag_router.py
    atp_repository: https://github.com/alliance-genome/agr_atp_ontology
    atp_commit: 74b358e69d4660d0c6bfce80eac6d486774cedaa
    topic:
      curie: ATP:0000041
      name: gene expression in wild type
    mod_abbreviation: WB
    field_mapping:
      reference_curie: Server document record.
      topic: This pack's configuration.
      mod_abbreviation: This pack's configuration.
      negated: The agent proposes it; the curator decides.
      note: Optional curator entry.
    ai_curation_only:
      - rationale
    display_only:
      - topic_name
    post_request_mapping:
      reference_curie: From the document record.
      topic: From this pack's configuration.
      negated: From the curator's decision.
      note: From the curator's entry; left out when blank.
      tag_source_id: Decided at submission for the curator's data provider.
      data_novelty: Decided at submission.
      data_context: Decided at submission.
    decided_at_submission:
      - tag_source_id
      - data_novelty
      - data_context
    not_sent:
      - confidence_level
      - confidence_score
