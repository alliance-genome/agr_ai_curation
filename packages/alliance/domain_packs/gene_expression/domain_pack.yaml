fixture_packs:
  - fixture_pack_id: tmem67_pending
    display_name: tmem67 pending gene expression fixtures
    path: fixtures/tmem67_pending.yaml
    description: Production-like pending GeneExpressionAnnotation envelope preserving tmem67 extraction evidence metadata.
    object_types:
      - GeneExpressionAnnotation
    definition_state: stable
    definition_notes:
      - Fixture values mirror grounded tmem67 curation DB shape while preserving extractor-side metadata.
  - fixture_pack_id: tmem67_multi_annotation_pending
    display_name: tmem67 multi-annotation pending gene expression fixtures
    path: fixtures/tmem67_multi_annotation_pending.yaml
    description: Focused same-gene multi-expression fixture proving one GeneExpressionAnnotation review row per retained expression statement.
    object_types:
      - GeneExpressionAnnotation
    definition_state: stable
    definition_notes:
      - Two retained expression statements share the same gene and reference but differ by expression site, stage, evidence, and metadata refs.
  - fixture_pack_id: curator_guidance_pending
    display_name: Curator guidance gene expression fixtures
    path: fixtures/curator_guidance_pending.yaml
    description: Release-oriented fixtures covering ZFIN flcn multi-site statements, anatomy-only, cellular-component-only, mixed site routing, negated expression, and optional experiment context preservation.
    object_types:
      - GeneExpressionAnnotation
    definition_state: stable
    definition_notes:
      - Optional reagent, specimen, allele, and condition context remains LinkML-backed pending payload or field-addressed metadata; it is not silently dropped just because it is non-export-blocking in 0.7.0.
      - Helper selections in fixture metadata document controlled-field provenance for relation, assay, stage, anatomy, and GO cellular-component selectors.
metadata:
  object_role_key: object_role
  curatable_unit_object_type: GeneExpressionAnnotation
  semantic_source: domain_envelope.extracted_objects
  legacy_semantic_lists: []
  validators:
    active:
      - validator_id: gene_expression.domain_envelope_shape
        display_name: Gene expression data structure
        curator_label: Confirm the extracted data has the expected structure
        description: Checks that the extracted gene expression data is in the structure the review screens and export expect.
        definition_notes:
          - Loads the envelope through the provider-agnostic DomainEnvelope contract.
      - validator_id: gene_expression.required_payload_fields
        display_name: Required gene expression fields
        curator_label: Confirm every required gene expression field is filled in
        description: Checks that each pending gene expression annotation has a value in every required field.
        definition_notes:
          - Required field paths are the ones this pack declares as required; each pending object payload must carry them.
      - validator_id: gene_expression.no_legacy_semantic_lists
        display_name: Current extraction format
        curator_label: Confirm the extraction uses the current record format
        description: Checks that the extraction uses the current record format and not an older list-based layout.
        definition_notes:
          - Rejects legacy semantic collections such as items, annotations, genes, alleles, diseases, chemicals, and phenotypes in new domain-envelope fixtures.
      - validator_id: gene_expression.extractor_output_migration
        display_name: Gene expression extractor format
        curator_label: Confirm the extractor output loads as gene expression records
        description: Checks that what the extractor produced loads as gene expression annotation records ready for review.
        definition_notes:
          - Validates runtime extractor output through the GeneExpressionAnnotation domain-envelope schema and pending-envelope conversion.
      - validator_id: gene_expression.linkml_extraction_contract
        display_name: Gene expression LinkML extraction contract
        curator_label: Confirm each gene expression record meets the Alliance data model
        description: Checks each gene expression record against the Alliance data model, covering required fields, evidence links, the relation term, the assay, and the expression context. Problems are reported on the field they belong to.
        definition_notes:
          - Package-owned deterministic validator; emits field-addressed extraction diagnostics for LinkML-required selectors, evidence integrity, relation vocabulary, assay/method selectors, and expression context postconditions.
      - validator_id: gene_expression.export_submission_projection
        display_name: Gene expression ready for export
        curator_label: Confirm each gene expression record is ready for export
        description: Checks that each gene expression record can be written out in the format the Alliance submission expects.
        definition_notes:
          - Validates GeneExpressionAnnotation export/submission target projection payloads.
      - validator_id: relation_vocabulary_validation
        display_name: Relation vocabulary lookup
        curator_label: Confirm the expression relation against the Expression Relation vocabulary
        description: Checks that the relation between the gene and the expression pattern, such as expressed_in, is a term in the Expression Relation vocabulary.
        definition_notes:
          - Runs through the controlled-vocabulary package validator binding (vocabulary Expression Relation) on the LinkML-required relation.
      - validator_id: data_provider_validation
        display_name: Data provider validation
        curator_label: Confirm the data provider against the Alliance member list
        description: Checks that the data provider abbreviation on each annotation, such as ZFIN or MGI, names an Alliance member database.
        definition_notes:
          - Runs through the shared Alliance data-provider package validator binding on the LinkML-required data provider abbreviation.
      - validator_id: subject_gene_validation
        display_name: Subject gene validation
        curator_label: Confirm the subject gene in the Alliance records
        description: Checks that the gene the annotation is about matches an Alliance gene record, by identifier or symbol, and fills in the confirmed identifier and symbol.
        definition_notes:
          - Runs through the shared Alliance gene package validator binding on the embedded expression annotation subject gene identifier and symbol.
      - validator_id: source_reference_validation
        display_name: Source reference validation
        curator_label: Confirm the source paper in the Alliance literature records
        description: Checks that the paper the annotation comes from matches an Alliance reference record, by identifier, CURIE, or title.
        definition_notes:
          - Runs through the API-backed reference package validator binding on the embedded literature/reference identifiers.
      - validator_id: expression_stage_ontology_validation
        display_name: Expression stage ontology lookup
        curator_label: Confirm the developmental stage against the stage ontology for the species
        description: Checks that the stage when expression was seen matches a term in the species stage ontology. The original wording from the paper is kept beside the confirmed term.
        definition_notes:
          - Runs through the ontology-term package validator binding (ontology family life_stage, lookup method search_life_stage_terms); original labels are preserved in materialization metadata.
      - validator_id: expression_assay_ontology_validation
        display_name: Expression assay ontology lookup
        curator_label: Confirm the assay against the Measurement Method Ontology
        description: Checks that the assay used to detect expression, such as in situ hybridization, matches a Measurement Method Ontology term. The original wording from the paper is kept beside the confirmed term.
        definition_notes:
          - Runs through the ontology-term package validator binding (ontology family assay, MMOTerm, lookup method search_ontology_terms); original labels are preserved in materialization metadata.
      - validator_id: expression_stage_uberon_slim_validation
        display_name: Stage UBERON slim lookup
        curator_label: Confirm each stage slim term against the allowed UBERON life-stage terms
        description: Checks that each broad life-stage term on the annotation is one of the allowed UBERON slim terms, such as embryo stage or post-embryonic stage.
        definition_notes:
          - Runs through the ontology-term package validator binding (ontology family uberon, UBERONTerm) with allowed_term_curies UBERON:0000068 and UBERON:0000113; the label 'post embryonic, pre-adult' is accepted unresolved. Materializes the stage UBERON slim term array through ontology lookup evidence.
      - validator_id: expression_anatomical_structure_validation
        display_name: Anatomical structure ontology lookup
        curator_label: Confirm the anatomical structure against the anatomy ontology for the species
        description: Checks that the tissue or structure where expression was seen matches a term in the species anatomy ontology, by identifier or name.
        definition_notes:
          - Runs through the ontology-term package validator binding (ontology family anatomy, lookup method search_anatomy_terms) on anatomical expression-site labels and CURIEs.
      - validator_id: expression_anatomical_uberon_slim_validation
        display_name: Anatomical UBERON slim lookup
        curator_label: Confirm each anatomy slim term against the allowed UBERON anatomy terms
        description: Checks that each broad anatomy term on the annotation is one of the allowed UBERON slim terms, such as nervous system or musculature.
        definition_notes:
          - Runs through the ontology-term package validator binding (ontology family uberon, UBERONTerm) with the allowed_term_curies list declared on the binding. Materializes the anatomical UBERON slim term array through ontology lookup evidence.
      - validator_id: expression_cellular_component_validation
        display_name: GO cellular component lookup
        curator_label: Confirm the cellular component against the Gene Ontology
        description: Checks that the part of the cell where expression was seen, such as nucleus or plasma membrane, matches a Gene Ontology cellular component term. An annotation may name a cellular component with no anatomical structure.
        definition_notes:
          - Runs through the ontology-term package validator binding (ontology family go, go_aspect cellular_component, lookup method search_go_terms); cellular-component-only expression sites are allowed.
      - validator_id: expression_cellular_component_qualifier_validation
        display_name: GO cellular component qualifier lookup
        curator_label: Confirm each cellular component qualifier against the Gene Ontology
        description: Checks that each qualifier attached to the cellular component matches a Gene Ontology cellular component term.
        definition_notes:
