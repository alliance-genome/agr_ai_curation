pack_id: gene
display_name: Gene Evidence Domain Pack
version: 0.1.0
metadata_api_version: 1.0.0
description: Exportable, non-mutating validated-reference evidence for extracted Alliance gene mentions.
status: in_development
schema_refs:
  - schema_id: alliance.linkml
    provider: alliance_linkml
    name: Alliance curation LinkML schema
    version: 1b11d0888f19eba4ca72022200bb7d96b30d4a52
    uri: https://github.com/alliance-genome/agr_curation_schema/tree/1b11d0888f19eba4ca72022200bb7d96b30d4a52
    definition_state: stable
    metadata:
      provider_refs:
        alliance_linkml:
          repository: https://github.com/alliance-genome/agr_curation_schema.git
          commit: 1b11d0888f19eba4ca72022200bb7d96b30d4a52
          schema_dir: model/schema
          root_schema: model/schema/allianceModel.yaml
          cache_script: scripts/testing/cache_agr_curation_schema.sh
          ref_kind: schema
enum_definitions:
  - enum_id: GeneMentionConfidence
    display_name: Gene mention confidence
    description: Extractor confidence in the normalized gene reference and paper-evidence match.
    values:
      - value: high
        label: High
      - value: medium
        label: Medium
      - value: low
        label: Low
  - enum_id: ResolutionState
    display_name: Resolution state
    description: Whether a validator confirmed the gene (resolved) or not (unresolved).
    values:
      - value: resolved
        label: Resolved
      - value: unresolved
        label: Unresolved
  - enum_id: LookupOutcome
    display_name: Lookup result
    description: What the gene lookup found; matched exactly when the gene is resolved.
    values:
      - value: matched
        label: Matched
      - value: not_found
        label: Not found
      - value: ambiguous
        label: Several matches
      - value: conflict
        label: Conflict
      - value: blocked
        label: Blocked
      - value: transient
        label: Temporary error
      - value: invalid_schema
        label: Invalid validator output
      - value: missing_expected_result_field
        label: Validator result incomplete
      - value: rejected_candidates
        label: Candidates rejected
      - value: not_validated
        label: Not validated yet
      - value: legacy_unverified
        label: Legacy, unverified
      - value: curator_override
        label: Curator override
model_definitions:
  - model_id: GeneMentionEvidencePayload
    display_name: Gene mention evidence payload
    description: Envelope-only payload grounded to Alliance Gene reference fields plus verified paper evidence.
    schema_ref:
      schema_id: alliance.linkml.Gene
      provider: alliance_linkml
      name: Gene
      version: 1b11d0888f19eba4ca72022200bb7d96b30d4a52
      uri: https://github.com/alliance-genome/agr_curation_schema/blob/1b11d0888f19eba4ca72022200bb7d96b30d4a52/model/schema/gene.yaml
      metadata:
        provider_refs:
          alliance_linkml:
            schema_ref: alliance.linkml
            commit: 1b11d0888f19eba4ca72022200bb7d96b30d4a52
            source_file: model/schema/gene.yaml
            class: Gene
    definition_state: stable
    definition_notes:
      - Payload is evidence/reference data only and is not an Alliance Gene write DTO.
    metadata:
      display:
        label: gene_symbol
        id: primary_external_id
        mention: mention
        validated:
          - taxon
object_definitions:
  - object_type: gene_mention_evidence
    display_name: Gene mention
    description: A tool-verified paper gene mention normalized to an existing Alliance Gene reference.
    model_ref: GeneMentionEvidencePayload
    schema_ref:
      schema_id: alliance.linkml.Gene
      provider: alliance_linkml
      name: Gene
      version: 1b11d0888f19eba4ca72022200bb7d96b30d4a52
      uri: https://github.com/alliance-genome/agr_curation_schema/blob/1b11d0888f19eba4ca72022200bb7d96b30d4a52/model/schema/gene.yaml
      metadata:
        provider_refs:
          alliance_linkml:
            schema_ref: alliance.linkml
            commit: 1b11d0888f19eba4ca72022200bb7d96b30d4a52
            source_file: model/schema/gene.yaml
            class: Gene
    definition_state: stable
    definition_notes:
      - Envelope-only validated reference evidence; this object does not create or mutate Alliance Gene rows.
      - Paper-gene association write behavior is intentionally out of scope until a concrete target is verified.
    metadata:
      object_role: validated_reference
      evidence_role: gene_mention_evidence
      blocking_validation: false
      generic_extraction:
        stageable: true
        task_hints:
          - gene
          - gene mention
          - symbol
          - allele or genotype context gene
      supervisor_manifest:
        # The validated symbol; an unresolved gene reads as its paper wording, labelled as such.
        primary_label_field: gene_symbol
        summary_fields:
          - primary_external_id
          - taxon
      workspace_display:
        primary_label_field: gene_symbol
        summary_fields:
          - gene_symbol
          - primary_external_id
          - taxon
        groups:
          # This is the curator decision surface: these are the canonical values
          # reviewed for export. The groups below remain envelope context and must
          # not be presented as peer validation/sign-off fields.
          - id: identity
            label: Gene identity
            fields:
              - gene_symbol
              - primary_external_id
              - taxon
              - species
              - resolution_state
              - lookup_outcome
              - validator_explanation
              - validator_curator_message
          - id: ai_proposal
            label: AI proposal
            fields:
              - proposed_gene_symbol
              - proposed_taxon
          - id: rationale
            label: Rationale
            fields:
              - rationale
          - id: evidence_location
            label: Evidence location
            fields:
              - section
              - page
              - subsection
              - figure_reference
          - id: provenance
            label: Provenance & notes
            fields:
              - data_provider_hint
              - identity_resolution_notes
              - confidence
      validator_bindings:
        active:
          - binding_id: alliance_gene_reference_lookup
            display_name: Alliance gene lookup
            curator_label: Confirm each gene mention in the Alliance records
            description: Checks that each gene named in the paper matches an Alliance gene record, by symbol, name, or identifier, and fills in the confirmed identifier.
            when_off: Gene mentions stay as the extractor wrote them, and review rows show them unconfirmed.
            definition_notes:
              - Runs through the gene package validator binding on the gene_mention_evidence object.
            validator_agent:
              package_id: agr.alliance
              agent_id: gene_validation
            applies_to:
              domain_pack_id: gene
              object_types:
                - gene_mention_evidence
            input_fields:
              mention:
                source: payload
                path: mention
              proposed_gene_id:
                source: payload
                path: proposed_primary_external_id
                required: false
              proposed_symbol:
                source: payload
                path: proposed_gene_symbol
                required: false
              proposed_taxon:
                source: payload
                path: proposed_taxon
                required: false
              taxon_hint:
                source: payload
                path: taxon_hint
                required: false
                context_only: true
              data_provider_hint:
                source: payload
                path: data_provider_hint
                required: false
                context_only: true
              species:
                source: payload
                path: species
                required: false
              evidence_quotes:
                source: evidence_record
                output: quote_bundle
                allow_multiple: true
                required: false
                context_only: true
              identity_resolution_notes:
                source: payload
                path: identity_resolution_notes
                required: true
                allow_multiple: true
            expected_result_fields:
              curie: primary_external_id
              symbol: gene_symbol
              taxon: taxon
            batch:
              enabled: false
              family: alliance_gene_reference_lookup
            required: true
            blocking: false
            allow_opt_out: true
            curator_override:
              allowed: false
      export_behavior:
        status: ready
        mode: validated_reference_evidence
        target_key: gene_validated_reference_evidence
        exportable: true
        mutates_base_gene: false
        creates_paper_gene_association: false
        reason: Export verified gene reference/evidence data without requiring a paper-gene association write target.
      write_behavior:
        mode: none
        write_target: none
        mutate_canonical_gene: false
        creates_paper_gene_association: false
        reason: Keep extracted genes as validated-reference envelope evidence until a concrete target is verified.
      provider_refs:
        alliance_linkml:
          schema_ref: alliance.linkml
          commit: 1b11d0888f19eba4ca72022200bb7d96b30d4a52
          source_file: model/schema/gene.yaml
          class: Gene
    fields:
      - field_path: mention
        field_type: string
        display_name: Gene mention (paper wording)
        description: Gene mention exactly as written in the paper. It is the extracted wording, not a validated gene.
        required: true
        metadata:
          evidence_source_field: true
          protected: true
          curator_action_note: Paper mention text is the source evidence anchor, not a normalized edit target.
      - field_path: primary_external_id
        field_type: string
        display_name: Gene ID
        description: Alliance Gene primary external identifier written by the gene validator; empty while the gene is unresolved.
        metadata:
          validatable: true
          validator_binding_id: alliance_gene_reference_lookup
          validation_result_field: curie
          editable: true
          curator_action_note: 'Curator override: typing an ID marks this value as a curator override.'
          source_of_truth: alliance_linkml
          provider_refs:
            alliance_linkml:
              schema_ref: alliance.linkml
              commit: 1b11d0888f19eba4ca72022200bb7d96b30d4a52
              source_file: model/schema/core.yaml
              class: Gene
              slot: primary_external_id
              range: string
      - field_path: gene_symbol
        field_type: string
        display_name: Gene symbol
        description: Current accepted symbol written by the gene validator; empty while the gene is unresolved.
        metadata:
          validatable: true
          validator_binding_id: alliance_gene_reference_lookup
          validation_result_field: symbol
          editable: true
          curator_action_note: 'Curator override: typing an ID marks this value as a curator override.'
          source_of_truth: alliance_linkml
          provider_refs:
            alliance_linkml:
              schema_ref: alliance.linkml
              commit: 1b11d0888f19eba4ca72022200bb7d96b30d4a52
              source_file: model/schema/gene.yaml
              class: Gene
              slot: gene_symbol
              range: GeneSymbolSlotAnnotation
      - field_path: taxon
        field_type: string
        display_name: Taxon
        description: NCBI Taxon CURIE written by the gene validator for the resolved gene; empty while the gene is unresolved.
        metadata:
          validatable: true
          validator_binding_id: alliance_gene_reference_lookup
          validation_result_field: taxon
          editable: true
          curator_action_note: 'Curator override: typing an ID marks this value as a curator override.'
          source_of_truth: alliance_linkml
          provider_refs:
            alliance_linkml:
              schema_ref: alliance.linkml
              commit: 1b11d0888f19eba4ca72022200bb7d96b30d4a52
              source_file: model/schema/core.yaml
              class: Gene
              slot: taxon
              range: NCBITaxonTerm
      - field_path: resolution_state
        field_type: enum
        display_name: Gene mention (status)
        description: Resolved only when the gene lookup validator confirmed the gene ID, symbol and taxon; otherwise unresolved.
        enum_ref: ResolutionState
        metadata:
          protected: true
      - field_path: lookup_outcome
        field_type: enum
        display_name: Gene mention (lookup result)
        description: What the gene lookup found; not validated yet until the validator runs.
        enum_ref: LookupOutcome
        metadata:
          protected: true
      - field_path: validator_explanation
        field_type: string
        display_name: Gene mention (validator explanation)
        description: The gene validator's own explanation of its result.
        metadata:
          protected: true
          hide_when_empty: true
      - field_path: validator_curator_message
        field_type: string
        display_name: Gene mention (validator message)
        description: The gene validator's message for curators, kept apart from its explanation.
        metadata:
          protected: true
          hide_when_empty: true
      - field_path: species
        field_type: string
        display_name: Species
        description: Curator-facing species label when available from extraction context.
      - field_path: taxon_hint
        field_type: string
        display_name: Taxon hint
        description: Paper-backed NCBI Taxon CURIE hint preserved for validator input.
      - field_path: data_provider_hint
        field_type: string
        display_name: Data provider hint
        description: Paper-backed Alliance provider hint preserved for validator input.
      - field_path: proposed_primary_external_id
        field_type: string
        display_name: Proposed gene ID
        description: Extractor-proposed Alliance Gene identifier for validator confirmation.
      - field_path: proposed_gene_symbol
        field_type: string
        display_name: Proposed gene symbol
        description: Extractor-proposed gene symbol for validator confirmation.
        metadata:
          render_as: divergence
          hide_when_empty: true
      - field_path: proposed_taxon
        field_type: string
        display_name: Proposed taxon
        description: Extractor-proposed NCBI Taxon CURIE for validator confirmation.
        metadata:
          render_as: divergence
          hide_when_empty: true
      - field_path: identity_resolution_notes
        field_type: array
        display_name: Identity resolution notes
        required: true
        description: Extractor-side notes describing paper-backed species or proposed identity hints.
        metadata:
          render_as: notes
          hide_when_empty: true
      - field_path: confidence
        field_type: enum
        display_name: Confidence
        required: true
        enum_ref: GeneMentionConfidence
      - field_path: rationale
        field_type: string
        display_name: Rationale
        required: false
        description: Curator-facing reason the extractor selected this gene as curatable from the paper, written at extraction time; separate from how the gene identity was resolved.
        metadata:
          protected: true
          curator_action_note: Written by the extraction agent; not editable.
      - field_path: evidence_record_id
        field_type: string
        display_name: Evidence record ID
        description: Stable ID returned by the paper evidence verification tool.
        required: true
        metadata:
          evidence_source_field: true
      - field_path: verified_quote
        field_type: string
        display_name: Verified quote
        description: Verbatim paper text verified by record_evidence.
        required: true
        metadata:
          evidence_source_field: true
      - field_path: page
        field_type: integer
        display_name: Page
        required: true
        metadata:
          render_as: evidence-locator
          hide_when_empty: true
          evidence_locator_field: true
      - field_path: section
        field_type: string
        display_name: Section
        required: true
        metadata:
          render_as: evidence-locator
          hide_when_empty: true
          evidence_locator_field: true
      - field_path: subsection
        field_type: string
        display_name: Subsection
        metadata:
          render_as: evidence-locator
          hide_when_empty: true
          evidence_locator_field: true
      - field_path: chunk_id
        field_type: string
        display_name: Chunk ID
        required: true
        metadata:
          evidence_locator_field: true
      - field_path: figure_reference
        field_type: string
        display_name: Figure/table reference
        metadata:
          render_as: evidence-locator
          hide_when_empty: true
          evidence_locator_field: true
fixture_packs:
  - fixture_pack_id: daf16_builder_pending
    display_name: Builder-materialized gene mention evidence fixtures
    path: fixtures/daf16_builder_pending.yaml
    description: Production-like pending envelope produced by the gene builder materializer with RELATIVE metadata_refs.
    object_types:
      - gene_mention_evidence
metadata:
  base_pack_id: agr.alliance.base
  object_role_key: object_role
  supported_object_roles:
    - validated_reference
  provider_refs:
    alliance_linkml:
      schema_ref: alliance.linkml
      repository: https://github.com/alliance-genome/agr_curation_schema.git
      commit: 1b11d0888f19eba4ca72022200bb7d96b30d4a52
      schema_dir: model/schema
      root_schema: model/schema/allianceModel.yaml
      cache_script: scripts/testing/cache_agr_curation_schema.sh
