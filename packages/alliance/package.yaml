package_id: agr.alliance
display_name: Alliance Defaults
version: 1.0.0
package_api_version: 1.0.0
min_runtime_version: 1.0.0
max_runtime_version: 2.0.0
python_package_root: python/src/agr_ai_curation_alliance
requirements_file: requirements/runtime.txt
dependencies:
  - package_id: agr.core
    version_range: ">=1.0.0,<2.0.0"
exports:
  - kind: identifier_prefixes
    name: curation_database
    path: python/src/agr_ai_curation_alliance/identifier_prefixes.py
    description: Alliance curation-schema identifier-prefix discovery
  - kind: group_rule
    name: supervisor.MGI
    path: group_rules/supervisor/mgi.yaml
    description: MGI-specific rules contributed to the agr.core supervisor
  - kind: group_rule
    name: supervisor.RGD
    path: group_rules/supervisor/rgd.yaml
    description: RGD-specific rules contributed to the agr.core supervisor
  - kind: tool_binding
    name: default
    path: tools/bindings.yaml
    description: Default AGR Alliance specialist tool bindings
  - kind: tool_policy_defaults
    name: default_tool_policies
    path: config/tool_policy_defaults.yaml
    description: Default AGR Alliance specialist tool policy defaults
  - kind: curation_adapter
    name: default
    path: python/src/agr_ai_curation_alliance/curation_adapters.py
    description: Package-owned curation adapter registrations
  - kind: document_source_provider
    name: abc_literature
    path: python/src/agr_ai_curation_alliance/document_sources/registration.py
    description: Alliance ABC Literature document-source provider registration
  - kind: flow_recipes
    name: alliance_flow_recipes
    path: config/flow_recipes.yaml
    description: Alliance Agent Studio recipes, aliases, and composition guidance
  - kind: agent_studio_prompt
    name: system
    path: config/agent_studio_system_prompt.md
    description: Alliance curator Agent Studio system prompt
# MAINTAINER NOTE: Adding a directory under packages/alliance/agents/ is not enough
# to activate a specialist. Every bundle with agents/<name>/agent.yaml must also be
# listed in agent_bundles below or startup will warn and skip that on-disk bundle.
agent_bundles:
  - name: agm
    has_schema: true
  - name: allele
    has_schema: true
    group_rules: [mgi, rgd]
  - name: allele_extractor
    has_schema: true
    group_rules: [fb, hgnc, mgi, rgd, sgd, wb, zfin]
  - name: chat_output
  - name: chemical
    has_schema: true
  - name: controlled_vocabulary
    has_schema: true
  - name: data_provider
    has_schema: true
  - name: csv_formatter
  - name: disease
    has_schema: true
  - name: disease_extractor
    has_schema: true
    group_rules: [fb, hgnc, mgi, rgd, sgd, wb, zfin]
  - name: experimental_condition
    has_schema: true
  - name: gene
    has_schema: true
    group_rules: [fb, hgnc, mgi, rgd, sgd, wb, zfin]
  - name: gene_expression
    has_schema: true
    group_rules: [wb, zfin]
  - name: gene_extractor
    has_schema: true
    group_rules: [fb, hgnc, mgi, rgd, sgd, wb, zfin]
  - name: gene_ontology
    has_schema: true
  - name: go_annotations
    has_schema: true
  - name: rgd_go_evidence_policy
    has_schema: true
  - name: json_formatter
  - name: ontology_term
    has_schema: true
  - name: orthologs
    has_schema: true
  - name: pdf
    group_rules: [fb, hgnc, mgi, rgd, sgd, wb, zfin]
  - name: phenotype_extractor
    has_schema: true
    group_rules: [fb, hgnc, mgi, rgd, sgd, wb, zfin]
  - name: reference
    has_schema: true
  - name: subject_entity
    has_schema: true
  - name: tsv_formatter
