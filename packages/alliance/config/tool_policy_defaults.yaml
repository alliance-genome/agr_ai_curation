    category: External API
    curator_visible: true
    allow_attach: true
    allow_execute: true
    config: {}

  go_api_call:
    display_name: GO Consortium Existing Annotations
    description: Fetch typed existing GO annotations with source provenance for a validated gene CURIE.
    category: External API
    curator_visible: true
    allow_attach: true
    allow_execute: true
    config: {}

  resolve_gene_product:
