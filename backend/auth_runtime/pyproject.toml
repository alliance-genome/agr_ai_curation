[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "auth-runtime"
version = "1.0.0"
description = "Shared provider-neutral OIDC authentication runtime"
requires-python = ">=3.11"
dependencies = ["httpx>=0.24", "PyJWT[crypto]>=2.10,<3"]

[tool.setuptools.packages.find]
where = ["."]
