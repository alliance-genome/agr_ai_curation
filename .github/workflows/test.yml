name: Unit Tests

on:
  pull_request:
    branches: [main, develop, integration/validation-review]
    paths:
      - 'backend/**'
      - 'frontend/**'
      - 'config/**'
      - 'packages/**'
      - 'docker-compose.yml'
      - 'docker-compose.test.yml'
      - 'docker-compose.benchmark-canary.yml'
      - 'docker-compose.production.yml'
      - 'promtail-config.yml'
      - 'scripts/install/**'
      - 'scripts/release/**'
      - 'scripts/testing/**'
      - 'scripts/tests/**'
      - 'trace_review/**'
      - 'agent_tests/**'
      - 'docs/testing/executable-flow-graph-parity.json'
      - '.github/workflows/test.yml'
  push:
    branches: [main, develop]
    paths:
      - 'backend/**'
      - 'frontend/**'
      - 'config/**'
      - 'packages/**'
      - 'docker-compose.yml'
      - 'docker-compose.test.yml'
      - 'docker-compose.benchmark-canary.yml'
      - 'docker-compose.production.yml'
      - 'promtail-config.yml'
      - 'scripts/install/**'
      - 'scripts/release/**'
      - 'scripts/testing/**'
      - 'scripts/tests/**'
      - 'trace_review/**'
      - 'agent_tests/**'
      - 'docs/testing/executable-flow-graph-parity.json'
      - '.github/workflows/test.yml'

# Supersede checks only within the same PR and workflow. Give every non-PR
# run its own group so pushes cannot evict running or pending validation.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  backend-unit-tests:
    name: Backend Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Select image checks
        id: image-scope
        run: python3 scripts/testing/ci_image_scope.py >> "$GITHUB_OUTPUT"

      - name: Test CI image selection
        run: python3 -m unittest discover -s scripts/tests -p test_ci_image_scope.py

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build unit test image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./backend/Dockerfile.unit-test
          push: false
          load: true
          tags: ai-curation-unit-tests:latest
          # Keep the unit-test Dockerfile cache in its own BuildKit namespace.
          # Without an explicit scope, unrelated CI image builds can overwrite
          # the default GHA cache entry and make layer reuse less predictable.
          cache-from: type=gha,scope=backend-unit-test
          cache-to: type=gha,mode=max,scope=backend-unit-test,ignore-error=true

      - name: Validate ignored test paths
        run: |
          bash backend/tests/unit/run_ci_unit_tests.sh --validate-only

      - name: Validate rendered production Compose contract
        run: |
          bash scripts/testing/production_compose_contract_test.sh

      - name: Build frontend runtime contract image
        if: steps.image-scope.outputs.nginx_runtime == 'true'
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          target: nginx-runtime-base
          push: false
          load: true
          tags: agr-ai-curation-frontend-nginx-contract:ci
          cache-from: type=gha,scope=frontend-nginx-contract
          cache-to: type=gha,mode=max,scope=frontend-nginx-contract,ignore-error=true

      - name: Validate frontend image runtime configuration
        if: steps.image-scope.outputs.nginx_runtime == 'true'
        run: |
          bash scripts/testing/frontend_nginx_pdf_limit_contract.sh --image agr-ai-curation-frontend-nginx-contract:ci

      - name: Run unit tests
        run: |
          mkdir -p backend/htmlcov backend/file_outputs/ci
          start_seconds="${SECONDS}"
          set +e
          docker run --rm \
            -v "${{ github.workspace }}/backend:/app/backend" \
            -v "${{ github.workspace }}/config:/app/config" \
            -v "${{ github.workspace }}/config:/runtime/config:ro" \
            -v "${{ github.workspace }}/packages:/app/packages:ro" \
            -v "${{ github.workspace }}/trace_review:/app/trace_review:ro" \
            -v "${{ github.workspace }}/docs:/app/docs:ro" \
            -v "${{ github.workspace }}/frontend:/app/frontend:ro" \
            -v "${{ github.workspace }}/scripts/testing:/app/scripts/testing:ro" \
            -v "${{ github.workspace }}/scripts/testing:/workspace/scripts/testing:ro" \
            -v "${{ github.workspace }}/.env.example:/workspace/.env.example:ro" \
            -v "${{ github.workspace }}/docker-compose.yml:/workspace/docker-compose.yml:ro" \
            -v "${{ github.workspace }}/docker-compose.production.yml:/workspace/docker-compose.production.yml:ro" \
            -v "${{ github.workspace }}/docker-compose.test.yml:/workspace/docker-compose.test.yml:ro" \
            -v "${{ github.workspace }}/Makefile:/workspace/Makefile:ro" \
            -v "${{ github.workspace }}/promtail-config.yml:/workspace/promtail-config.yml:ro" \
            -v "${{ github.workspace }}/scripts/install:/workspace/scripts/install:ro" \
            -e PYTHONUNBUFFERED=1 \
            -e OPENAI_API_KEY=test-key-for-unit-tests \
            -e LANGFUSE_PUBLIC_KEY=test-key \
            -e LANGFUSE_SECRET_KEY=test-key \
            -e PDF_EXTRACTION_TIMEOUT=300 \
            -e EMBEDDING_MODEL=text-embedding-3-small \
            -e EMBEDDING_TOKEN_PREFLIGHT_ENABLED=true \
            -e EMBEDDING_MODEL_TOKEN_LIMIT=8191 \
            -e EMBEDDING_TOKEN_SAFETY_MARGIN=500 \
            -e CONTENT_PREVIEW_CHARS=1600 \
            -e WEAVIATE_BATCH_REQUESTS_PER_MINUTE=5000 \
            -e BACKEND_UNIT_TEST_WORKERS=2 \
            -e BACKEND_UNIT_TEST_DURATIONS=25 \
            -e BACKEND_UNIT_JUNIT_XML=file_outputs/ci/backend-unit-junit.xml \
            -e BACKEND_UNIT_SUMMARY_FILE=file_outputs/ci/backend-unit-summary.md \
            ai-curation-unit-tests:latest \
            bash /app/backend/tests/unit/run_ci_unit_tests.sh
          test_status="$?"
          set -e
          duration_seconds="$((SECONDS - start_seconds))"
          {
            echo "### Backend unit container"
            echo ""
            echo "- Docker run plus pytest duration: \`${duration_seconds}s\`"
            echo "- Exit status: \`${test_status}\`"
            echo ""
            if [[ -f backend/file_outputs/ci/backend-unit-summary.md ]]; then
              cat backend/file_outputs/ci/backend-unit-summary.md
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          exit "${test_status}"

      - name: Verify Docker tests left no backend cache artifacts
        if: always()
        shell: bash
        run: bash scripts/testing/assert_no_backend_test_cache_artifacts.sh

      - name: Upload backend coverage artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-unit-coverage
          path: |
            backend/.coverage
            backend/coverage.xml
            backend/htmlcov
            backend/file_outputs/ci/backend-unit-junit.xml
            backend/file_outputs/ci/backend-unit-summary.md

      - name: Test Summary
        if: always()
        run: |
          echo "## Unit Test Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Backend unit tests completed. See logs above for details." >> $GITHUB_STEP_SUMMARY
          echo "Coverage artifacts uploaded: \`backend-unit-coverage\`." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Excluded Tests (Require Database or External Dependencies)" >> $GITHUB_STEP_SUMMARY
          echo "- \`test_files.py\` - Requires PostgreSQL" >> $GITHUB_STEP_SUMMARY
          echo "- \`test_batch_service.py\` - Requires PostgreSQL" >> $GITHUB_STEP_SUMMARY

  backend-contract-core-tests:
    name: Backend Contract Core Tests
    runs-on: ubuntu-latest
    env:
      COMPOSE_PROJECT_NAME: backend-contract-ci

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend contract test image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile.test
          push: false
          load: true
          tags: |
            ai-curation-backend-tests:latest
            backend-contract-ci-backend-contract-tests:latest
          # Contract tests use backend/Dockerfile.test, so keep this separate
          # from the lighter backend/Dockerfile.unit-test cache namespace.
          cache-from: type=gha,scope=backend-contract-test
          cache-to: type=gha,mode=max,scope=backend-contract-test,ignore-error=true

      - name: Validate contract-core test paths
        run: |
          docker run --rm \
            -v "${{ github.workspace }}/backend:/app/backend" \
            ai-curation-backend-tests:latest \
            bash /app/backend/tests/contract/run_ci_contract_core_tests.sh --validate-only

      - name: Run contract-core tests
        run: |
          docker compose -f docker-compose.test.yml up -d --wait postgres-test redis-test weaviate-test
          docker compose -f docker-compose.test.yml run --rm backend-contract-tests \
            bash -lc "alembic upgrade head && bash tests/contract/run_ci_contract_core_tests.sh"

      - name: Verify Docker tests left no backend cache artifacts
        if: always()
        shell: bash
        run: bash scripts/testing/assert_no_backend_test_cache_artifacts.sh

      - name: Contract-core Summary
        if: always()
        run: |
          echo "## Contract Core Test Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Contract-core tests completed." >> $GITHUB_STEP_SUMMARY
          echo "Runs all of backend/tests/contract; legacy fail-first specs and live curation DB contracts skip themselves." >> $GITHUB_STEP_SUMMARY

  backend-integration-tests:
    name: Backend Integration Tests
    runs-on: ubuntu-latest
    env:
      COMPOSE_PROJECT_NAME: backend-integration-ci

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend integration test image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile.test
          push: false
          load: true
          tags: backend-integration-ci-backend-integration-tests:latest
          # The same backend/Dockerfile.test as the contract job: share its cache.
          cache-from: type=gha,scope=backend-contract-test
          cache-to: type=gha,mode=max,scope=backend-contract-test,ignore-error=true

      # tests/integration outside persistence/ (the persistence job runs that folder).
      # Tests that need what CI cannot give skip themselves and say why: the live
      # PDFX smoke (PDFX_LIVE_ENABLE), the release-history migration convergence
      # check (MIGRATION_CONVERGENCE_TEST_DATABASE_URL plus production exports) and
      # the external curation database queries (CURATION_DB_URL).
      - name: Run integration tests (outside persistence)
        run: |
          docker compose -f docker-compose.test.yml up -d --wait postgres-test redis-test weaviate-test
          docker compose -f docker-compose.test.yml run --rm backend-integration-tests \
            bash -lc "alembic upgrade head && python -m pytest -q --tb=short --strict-markers -rs tests/integration --ignore=tests/integration/persistence"

      - name: Verify Docker tests left no backend cache artifacts
        if: always()
        shell: bash
        run: bash scripts/testing/assert_no_backend_test_cache_artifacts.sh

      - name: Cleanup
        if: always()
        run: docker compose -f docker-compose.test.yml down -v

      - name: Integration Summary
        if: always()
        run: |
          echo "## Integration Test Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Runs backend/tests/integration outside persistence/; live-service tests skip themselves." >> $GITHUB_STEP_SUMMARY

  trace-review-backend-tests:
    name: TraceReview Backend Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build TraceReview test image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./trace_review/backend/Dockerfile
          target: test
          push: false
          load: true
          # Compose's default project/service image name for this file.
          tags: trace_review-backend-tests:latest
          cache-from: type=gha,scope=trace-review-backend-test
          cache-to: type=gha,mode=max,scope=trace-review-backend-test,ignore-error=true

      - name: Run complete TraceReview backend suite
        run: |
          docker image inspect trace_review-backend-tests:latest > /dev/null
          compose_plugin=$(docker info --format '{{range .ClientInfo.Plugins}}{{if eq .Name "compose"}}{{.Path}}{{end}}{{end}}')
          test -x "$compose_plugin"
          docker compose -p trace_review -f trace_review/docker-compose.yml run --rm --pull never \
            -v "$compose_plugin:/usr/local/bin/docker-compose:ro" \
            -v "$PWD/trace_review/docker-compose.yml:/app/trace_review/docker-compose.yml:ro" \
            -e COMPOSE_BIN=/usr/local/bin/docker-compose backend-tests

      - name: Cleanup TraceReview test resources
        if: always()
        run: docker compose -p trace_review -f trace_review/docker-compose.yml down --volumes --remove-orphans --rmi local

  trace-review-frontend-tests:
    name: TraceReview Frontend Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: trace_review/frontend/package-lock.json
      - name: Install TraceReview frontend dependencies
        working-directory: trace_review/frontend
        run: npm ci
      - name: Run TraceReview frontend tests
        working-directory: trace_review/frontend
        run: npx vitest run

  midscene-harness-offline-tests:
    name: Midscene Harness Offline Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # node --test expands the tests/**/*.test.ts glob itself from Node 21 on.
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: agent_tests/midscene/package-lock.json
      - name: Install harness dependencies
        working-directory: agent_tests/midscene
        run: npm ci
      # Type check, offline unit tests and scenario YAML validation; no browser,
      # no app, no model calls (the live smoke run stays manual).
      - name: Run harness offline checks
        working-directory: agent_tests/midscene
        run: npm run check

  installer-shell-regression-tests:
    name: Installer Shell Regression Suite
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run installer shell regression suite
        shell: bash
        run: |
          set -o pipefail
          mkdir -p artifacts/installer-shell-tests
          bash scripts/install/tests/run.sh | tee artifacts/installer-shell-tests/installer-shell-regression.log

      - name: Upload installer shell regression log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: installer-shell-regression-log
          path: artifacts/installer-shell-tests/installer-shell-regression.log
          if-no-files-found: error

      - name: Installer shell summary
        if: always()
        run: |
          echo "## Installer Shell Regression Suite" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Ran \`bash scripts/install/tests/run.sh\` on \`ubuntu-latest\`." >> $GITHUB_STEP_SUMMARY
          echo "Job status: \`${{ job.status }}\`." >> $GITHUB_STEP_SUMMARY
          echo "Artifact: \`installer-shell-regression-log\`." >> $GITHUB_STEP_SUMMARY

  publish-artifact-shell-regression-tests:
    name: Publish Artifact Shell Regression Suite
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run publish-artifact shell regression suite
        shell: bash
        run: |
          set -o pipefail
          mkdir -p artifacts/publish-artifact-shell-tests
          bash scripts/tests/test_prepare_publish_artifacts.sh | tee artifacts/publish-artifact-shell-tests/publish-artifact-shell-regression.log

      - name: Upload publish-artifact shell regression log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: publish-artifact-shell-regression-log
          path: artifacts/publish-artifact-shell-tests/publish-artifact-shell-regression.log
          if-no-files-found: error

      - name: Publish-artifact shell summary
        if: always()
        run: |
          echo "## Publish Artifact Shell Regression Suite" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Ran \`bash scripts/tests/test_prepare_publish_artifacts.sh\` on \`ubuntu-latest\`." >> $GITHUB_STEP_SUMMARY
          echo "This suite checks reproducible bundled core artifacts and image-tag alignment for backend, frontend, and trace-review assets." >> $GITHUB_STEP_SUMMARY
          echo "Job status: \`${{ job.status }}\`." >> $GITHUB_STEP_SUMMARY
          echo "Artifact: \`publish-artifact-shell-regression-log\`." >> $GITHUB_STEP_SUMMARY

  openai-agents-upgrade-gate-shell-regression-tests:
    name: OpenAI Agents Upgrade Gate Shell Regression Suite
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run OpenAI Agents upgrade gate shell regression suite
        shell: bash
        run: |
          set -o pipefail
          mkdir -p artifacts/openai-agents-upgrade-gate-shell-tests
          bash scripts/tests/test_check_openai_agents_upgrade_gate.sh | tee artifacts/openai-agents-upgrade-gate-shell-tests/openai-agents-upgrade-gate-shell-regression.log

      - name: Upload OpenAI Agents upgrade gate shell regression log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: openai-agents-upgrade-gate-shell-regression-log
          path: artifacts/openai-agents-upgrade-gate-shell-tests/openai-agents-upgrade-gate-shell-regression.log
          if-no-files-found: error

      - name: OpenAI Agents upgrade gate shell summary
        if: always()
        run: |
          echo "## OpenAI Agents Upgrade Gate Shell Regression Suite" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Ran \`bash scripts/tests/test_check_openai_agents_upgrade_gate.sh\` on \`ubuntu-latest\`." >> $GITHUB_STEP_SUMMARY
          echo "This suite checks SDK pin-diff detection, smoke-evidence enforcement, and invalid diff-range failure behavior." >> $GITHUB_STEP_SUMMARY
          echo "Job status: \`${{ job.status }}\`." >> $GITHUB_STEP_SUMMARY
          echo "Artifact: \`openai-agents-upgrade-gate-shell-regression-log\`." >> $GITHUB_STEP_SUMMARY

  docker-test-compose-regression:
    name: Docker Test Compose Regression
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check helper argument handling and workspace identities
        run: bash scripts/tests/test_docker_test_compose.sh
      - name: Check local and prebuilt agent gate smoke images
        run: bash scripts/tests/test_agent_pr_gate_backend_smoke.sh
      - name: Check installed package freshness across builds and workspaces
        run: python3 scripts/tests/test_docker_test_compose_freshness.py
      # Stub-based tests of the local test, preflight and agent helper scripts
      # (docker is only stubbed or asked for `compose config`). The last five also
      # run in the agent PR gate when their targets change; running them on every
      # pull request catches drift in what they call (about 3 s).
      - name: Check local test, preflight and agent helper scripts
        run: |
          for test_script in \
            test_abc_literature_ready_upload_smoke_docker.sh \
            test_agent_lsp_diagnostics.sh \
            test_agent_lsp_typescript_prep.sh \
            test_collect_agent_evidence.sh \
            test_llm_provider_smoke_local.sh \
            test_ensure_local_langfuse_env.sh \
            test_file_output_storage_preflight.sh \
            test_pdf_viewer_route_preflight.sh \
            test_prepare_test_stack.sh \
            test_rerank_provider_smoke_local.sh \
            test_reranker_compose_profiles.sh \
            test_run_tests.sh \
            test_trace_review_preflight.sh; do
            echo "::group::${test_script}"
            bash "scripts/tests/${test_script}"
            echo "::endgroup::"
          done

  backend-persistence-tests:
    name: Backend Persistence Tests
    runs-on: ubuntu-latest
    env:
      COMPOSE_PROJECT_NAME: backend-persistence-ci

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build test image (lightweight - no ML deps needed)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./backend/Dockerfile.unit-test
          push: false
          load: true
          tags: backend-persistence-ci-backend-persistence-tests:latest
          # Reuse the same cache scope as Backend Unit Tests because this job
          # builds the same backend/Dockerfile.unit-test image.
          cache-from: type=gha,scope=backend-unit-test
          cache-to: type=gha,mode=max,scope=backend-unit-test,ignore-error=true

      - name: Run persistence tests
        run: |
          docker compose -f docker-compose.test.yml up -d weaviate-test
          echo "Waiting for Weaviate test instance..."
          for i in $(seq 1 30); do
            if docker compose -f docker-compose.test.yml exec -T weaviate-test \
              wget -q -O- http://localhost:8080/v1/.well-known/ready 2>/dev/null; then
              echo "Weaviate is ready"
              break
            fi
            echo "  Attempt $i/30..."
            sleep 2
          done
          docker compose -f docker-compose.test.yml run --rm backend-persistence-tests

      - name: Cleanup
        if: always()
        run: docker compose -f docker-compose.test.yml down -v

      - name: Test Summary
        if: always()
        run: |
          echo "## Persistence Test Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Chunk persistence integration tests completed." >> $GITHUB_STEP_SUMMARY
          echo "These tests verify chunks actually persist in Weaviate after batch insert." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**No OpenAI API key required** - uses vectorizer: none" >> $GITHUB_STEP_SUMMARY

  benchmark-replacement-canary:
    name: Benchmark Replacement Canary
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run the isolated replacement canary
        env:
          AI_CURATION_TEST_DOCKER_MODE: rootful
        run: scripts/testing/benchmark-replacement-canary.sh

  frontend-tests:
    name: Frontend Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Run frontend tests
        working-directory: frontend
        run: npm run test -- --run

      - name: Frontend Test Summary
        if: always()
        run: |
          echo "## Frontend Test Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Frontend tests completed. See logs above for details." >> $GITHUB_STEP_SUMMARY
          echo "This blocking job is the authoritative clean-checkout frontend suite." >> $GITHUB_STEP_SUMMARY

  frontend-type-check:
    name: Frontend Type Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      # tsc --noEmit over the whole frontend: any TypeScript error fails, in any
      # file. Frontend Build (vite build) strips types without checking them and
      # vitest does not type check, so nothing else catches a type error.
      - name: Type check the frontend
        working-directory: frontend
        run: npm run type-check

  frontend-build:
    name: Frontend Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build && npm run build:cost

      - name: Frontend Summary
        if: always()
        run: |
          echo "## Frontend Build Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Frontend build completed. See logs above for details." >> $GITHUB_STEP_SUMMARY
